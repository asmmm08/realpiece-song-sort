<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ff5ca8">
<title>リアルピース 楽曲ソート 🎵</title>
<style>
*{box-sizing:border-box}
:root{--pink:#ff5ca8;--purple:#795cff;--ink:#29222e}
body{margin:0;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 0%,#ffe2f0 0,transparent 30%),radial-gradient(circle at 90% 10%,#e8e1ff 0,transparent 35%),#fffafe;min-height:100vh}
header{text-align:center;padding:42px 16px 24px}h1{font-size:clamp(30px,8vw,58px);margin:0;letter-spacing:.04em}header p{margin:10px 0;color:#766b7d}
main{width:min(940px,94vw);margin:auto;padding-bottom:60px}
.card{background:#ffffffeb;border:1px solid #eee4f1;border-radius:30px;padding:clamp(22px,5vw,46px);box-shadow:0 18px 50px #5a286012}
button{border:0;border-radius:18px;padding:15px 20px;font:inherit;font-weight:750;cursor:pointer;transition:.15s;box-shadow:0 6px 18px #00000010}
button:hover{transform:translateY(-2px)}
.primary{background:linear-gradient(135deg,var(--pink),var(--purple));color:white;width:100%}
.secondary{background:#f3edf7;color:#493c50}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.actions button{flex:1;min-width:190px}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:25px}
.choice{min-height:190px;background:#fff;font-size:clamp(20px,4vw,32px);display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;border:3px solid #f4bfdc}
.choice:nth-child(2){border-color:#c9c0ff}
.progress{height:11px;background:#eee8ef;border-radius:99px;overflow:hidden;margin:18px 0 25px}
.bar{height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--purple));transition:.25s}
.meta{display:flex;justify-content:space-between;color:#827586;font-size:14px}
.hint{text-align:center;color:#827586;margin:10px 0}
#sorter,#result{display:none}
.rank{display:grid;grid-template-columns:64px 1fr;gap:8px;padding:14px 8px;border-bottom:1px solid #eee7ef;font-size:18px}
.rank:first-child{background:#fff0f7;border-radius:16px}
.num{font-weight:850;font-size:20px}.song{font-weight:650}
.topnote{background:#faf4ff;border-radius:18px;padding:14px;margin:15px 0;color:#5f5367}
.note{font-size:13px;line-height:1.7;color:#817487}
@media(max-width:650px){.choice-grid{grid-template-columns:1fr}.choice{min-height:125px}}
</style>
</head>
<body>
<header><h1>🎵 リアルピース</h1><p>楽曲ソート / SONG SORT</p></header>
<main>
<section id="start" class="card">
<h2>あなたの好きなリアピ曲は？</h2>
<p>34曲を2択で比べて、あなた専用のランキングを作ります。</p>
<button class="primary" onclick="startSorter()">ソートをはじめる ✨</button>
<div class="actions">
<button class="secondary" onclick="resumeSorter()">途中から再開</button>
<button class="secondary" onclick="clearSaved()">保存データを削除</button>
</div>
<p class="note">選択内容はこの端末のブラウザに保存されます。</p>
</section>

<section id="sorter" class="card">
<div class="meta"><span id="round"></span><span id="count"></span></div>
<div class="progress"><div id="bar" class="bar"></div></div>
<h2 style="text-align:center">どっちを上位にする？</h2>
<p class="hint">好きなほうをタップ！直感でOK 🎀</p>
<div class="choice-grid">
<button id="left" class="choice" onclick="choose(0)"></button>
<button id="right" class="choice" onclick="choose(1)"></button>
</div>
<div class="actions">
<button class="secondary" onclick="undo()">↩ ひとつ戻る</button>
<button class="secondary" onclick="goHome()">保存して終了</button>
</div>
</section>

<section id="result" class="card">
<h2>🏆 あなたのリアピ楽曲ランキング</h2>
<div id="sub" class="topnote"></div>
<div id="ranking"></div>
<div class="actions">
<button class="primary" onclick="restart()">もう一度ソートする</button>
<button class="secondary" onclick="copyResult()">ランキングをコピー</button>
</div>
<p class="note">※今回指定された34曲を使用しています。</p>
</section>
</main>

<script>
const SONGS=[
  'リアルピース',
  'むげん',
  'ぷんぷん丸',
  '黎明',
  'アンロック',
  '特別な言葉',
  'トレジャー',
  '物語',
  'センチメンタル・コンプレックス',
  'ラッタ王国',
  'プレパラートハート',
  'ぷわぷわユニバース☆',
  'プリティーボーイ',
  'ぱぴぷぺぽ',
  'パジャマ',
  'Masquerade',
  '五柱',
  'GET READY!',
  'Diki♡Diki-DAN☆DAN',
  '0',
  'RUM-PUM',
  'ちょんまげベイビー',
  'チュー・シー・パイ',
  'モンブランヘッド',
  '壁の花',
  '解脱',
  'ばぐばぐぱーてぃー',
  'ギャラクシーハート',
  'リアピ夏祭り',
  'ビネガー革命',
  'プリティーガール',
  'パラダイス',
  'ハンズアップ',
  'ラブが恋したい'
];
const KEY="realpiece-sort-v3";
let state=null;

const $=id=>document.getElementById(id);

function fresh(){
  return {
    sorted:[0],
    current:1,
    low:0,
    high:0,
    mid:0,
    phase:"search",
    comparisons:0,
    history:[]
  };
}

function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function load(){try{return JSON.parse(localStorage.getItem(KEY));}catch(e){return null;}}

function startSorter(){
  state=fresh();
  $("start").style.display="none";
  $("result").style.display="none";
  $("sorter").style.display="block";
  nextSong();
}

function resumeSorter(){
  const s=load();
  if(!s){alert("保存データはありません。");return;}
  state=s;
  $("start").style.display="none";
  $("result").style.display="none";
  $("sorter").style.display="block";
  render();
}

function clearSaved(){
  localStorage.removeItem(KEY);
  alert("保存データを削除しました。");
}

function goHome(){
  save();
  $("sorter").style.display="none";
  $("result").style.display="none";
  $("start").style.display="block";
}

function nextSong(){
  if(state.current>=SONGS.length){finish();return;}
  state.low=0;
  state.high=state.sorted.length;
  state.phase="search";
  ask();
}

function ask(){
  if(state.low>=state.high){
    state.sorted.splice(state.low,0,state.current);
    state.current++;
    save();
    nextSong();
    return;
  }
  state.mid=Math.floor((state.low+state.high)/2);
  state.phase="compare";
  render();
}

function choose(which){
  if(state.phase!=="compare")return;

  state.history.push(JSON.stringify({
    sorted:[...state.sorted],
    current:state.current,
    low:state.low,
    high:state.high,
    mid:state.mid,
    phase:state.phase,
    comparisons:state.comparisons
  }));

  state.comparisons++;

  const existing=state.sorted[state.mid];

  // 左を選ぶ = 既存曲を上位、右を選ぶ = 挿入中の曲を上位
  if(which===0){
    state.low=state.mid+1;
  }else{
    state.high=state.mid;
  }

  save();
  ask();
}

function undo(){
  if(!state.history.length){
    alert("これ以上戻れません。");
    return;
  }
  state=JSON.parse(state.history.pop());
  save();
  render();
}

function render(){
  if(!state||state.current>=SONGS.length)return;

  const currentSong=SONGS[state.current];
  const existing=SONGS[state.sorted[state.mid]];

  $("left").textContent=existing;
  $("right").textContent=currentSong;
  $("count").textContent="比較 "+state.comparisons+"回";
  $("round").textContent=(state.current)+" / "+SONGS.length+"曲目を順位決定中";
  $("bar").style.width=Math.min(99,(state.current-1)/(SONGS.length-1)*100)+"%";
}

function finish(){
  $("sorter").style.display="none";
  $("result").style.display="block";
  $("sub").textContent="34曲のソート完了！ 比較 "+state.comparisons+"回";
  $("ranking").innerHTML=state.sorted.map((x,i)=>
    '<div class="rank"><div class="num">'+(i+1)+'位</div><div class="song">'+esc(SONGS[x])+'</div></div>'
  ).join("");
  save();
}

function restart(){
  if(confirm("ランキングを消して最初からやり直しますか？"))startSorter();
}

function copyResult(){
  const text="🎵 リアルピース 楽曲ソート 結果\n\n"+
    state.sorted.map((x,i)=>(i+1)+"位　"+SONGS[x]).join("\n");
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(()=>alert("ランキングをコピーしました！"));
  }else{
    alert(text);
  }
}

function esc(s){
  return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
